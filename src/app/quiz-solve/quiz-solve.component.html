<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz – Music Mentor</title>
</head>
<body>
  <div class="dashboard-container">

  <!-- LEWY PANEL -->
  <app-sidebar></app-sidebar>

  <!-- PRAWA STRONA -->
  <main class="main-content">

    <!-- ======================= -->
    <!-- Widok PYTAŃ -->
    <!-- ======================= -->
    <section *ngIf="!showResult" class="quiz-section">

      <header>
        <h1>{{ quizTitle }}</h1>
        <p class="description">{{ quizDescription }}</p>
      </header>

      <form
        *ngIf="questionList && questionList.length > 0 && currentQuestionIndex < questionList.length"
        (ngSubmit)="next()"
        #quizForm="ngForm"
        class="question-card"
      >
        <h2>Pytanie {{ currentQuestionIndex + 1 }} z {{ questionList.length }}</h2>

        <p class="question">
          {{ questionList[currentQuestionIndex].questionTitle }}
        </p>

        <div class="options">
          <label>
            <input type="radio" name="answer"
                   [(ngModel)]="selectedOption" value="answer1" required />
            {{ questionList[currentQuestionIndex].answer1 }}
          </label>

          <label>
            <input type="radio" name="answer"
                   [(ngModel)]="selectedOption" value="answer2" required />
            {{ questionList[currentQuestionIndex].answer2 }}
          </label>

          <label>
            <input type="radio" name="answer"
                   [(ngModel)]="selectedOption" value="answer3" required />
            {{ questionList[currentQuestionIndex].answer3 }}
          </label>

          <label>
            <input type="radio" name="answer"
                   [(ngModel)]="selectedOption" value="answer4" required />
            {{ questionList[currentQuestionIndex].answer4 }}
          </label>
        </div>

        <!-- PRZYCISKI -->
        <div class="actions" *ngIf="currentQuestionIndex + 1 < questionList.length">
          <button class="btn" type="submit" [disabled]="!selectedOption">Dalej</button>
        </div>

        <div class="actions" *ngIf="currentQuestionIndex + 1 == questionList.length">
          <button class="btn" type="submit" (click)="saveQuizAnswer()" [disabled]="!selectedOption">
            Zakończ
          </button>
        </div>

      </form>
    </section>


    <!-- ======================= -->
    <!-- Widok PODSUMOWANIA -->
    <!-- ======================= -->
    <section *ngIf="showResult" class="result-section">
      <div class="result-card">
        <h2>{{ quizTitle }}</h2>

        <p class="description">{{ quizDescription }}</p>

        <div class="score-main">
          <span class="score">{{ scoreSum }}</span>
          <span class="of">/ {{ quizScore }}</span>
        </div>

        <div class="progress">
          <div class="bar" [style.width.%]="(scoreSum / quizScore) * 100"></div>
        </div>

        <p class="percent">
          {{ ((scoreSum / quizScore) * 100) | number:'1.0-0' }}%
        </p>

        <button class="btn" [routerLink]="['/quiz-list']">
          Powrót
        </button>
      </div>
    </section>

  </main>

</div>

</body>
</html>
